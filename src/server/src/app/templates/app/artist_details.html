<!-- Wrapper rendered into #core_modal_content; invokes the artist_details cotton component. -->
<c-app-artist-details
    name="{{ name }}"
    bio="{{ bio }}"
    url="{{ url }}"
    avatar_url="{{ avatar_url }}"
    cover_url="{{ cover_url }}"
    cover_style="{{ cover_style }}"
    uploaded_count="{{ uploaded_count }}"
    favourited_count="{{ favourited_count }}" />
