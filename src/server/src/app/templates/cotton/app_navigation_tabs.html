<c-vars target="#tab_content" />
<!--
The home page's tab bar: three daisyUI radio tabs that decide what the main
body region shows. Each radio carries its own hx-get and swaps the fetched
fragment into `target` (app/home.html's #tab_content) on change — a radio only
fires change when it becomes checked, so re-clicking the active tab fetches
nothing.

The 200ms swap delay gives #tab_content time to transition its complete current
body out before htmx replaces it. Each response then mounts its own primary and
secondary stages through c-core-tab-body.
-->
<!-- Explicit widths and a single flex row avoid daisyUI's radio-tab sizing bug
     in iOS WebKit. -->
<div class="tabs tabs-lift flex-nowrap" role="radiogroup" aria-label="Home sections">
    <input type="radio"
           id="home-tab-about"
           name="home_tabs"
           class="tab w-auto"
           aria-label="ABOUT US"
           aria-controls="tab_content"
           hx-get="{% url 'app:home_tab_about' %}"
           hx-target="{{ target }}"
           hx-sync="{{ target }}:replace"
           hx-swap="innerHTML swap:200ms" />
    <input type="radio"
           id="home-tab-listen"
           name="home_tabs"
           class="tab w-auto"
           aria-label="LISTEN"
           aria-controls="tab_content"
           checked="checked"
           hx-get="{% url 'app:home_tab_mixer' %}"
           hx-target="{{ target }}"
           hx-sync="{{ target }}:replace"
           hx-swap="innerHTML swap:200ms" />
    <input type="radio"
           id="home-tab-library"
           name="home_tabs"
           class="tab w-auto"
           aria-label="LIBRARY"
           aria-controls="tab_content"
           hx-get="{% url 'library:initial' %}"
           hx-target="{{ target }}"
           hx-sync="{{ target }}:replace"
           hx-swap="innerHTML swap:200ms" />
</div>
