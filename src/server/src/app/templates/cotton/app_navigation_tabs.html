<c-vars target="#tab_content" />
<!--
The home page's tab bar: three daisyUI radio tabs that decide what the main
body region shows. Each radio carries its own hx-get and swaps the fetched
fragment into `target` (app/home.html's #tab_content) on change — a radio only
fires change when it becomes checked, so re-clicking the active tab fetches
nothing.

Each response replaces #tab_content directly. Tab changes have no content-level
transition or delayed swap.
-->
<!-- Explicit widths and a single flex row avoid daisyUI's radio-tab sizing bug
     in iOS WebKit. -->
<div class="tabs tabs-lift flex-nowrap" role="radiogroup" aria-label="Home sections">
    <input type="radio"
           id="home-tab-about"
           name="home_tabs"
           class="tab w-auto"
           aria-label="ABOUT"
           aria-controls="tab_content"
           hx-get="{% url 'app:home_tab_about' %}"
           hx-target="{{ target }}"
           hx-sync="{{ target }}:replace"
           hx-swap="innerHTML" />
    <input type="radio"
           id="home-tab-explore"
           name="home_tabs"
           class="tab w-auto"
           aria-label="EXPLORE"
           aria-controls="tab_content"
           checked="checked"
           hx-get="{% url 'explore:index' %}"
           hx-target="{{ target }}"
           hx-sync="{{ target }}:replace"
           hx-swap="innerHTML" />
    <input type="radio"
           id="home-tab-library"
           name="home_tabs"
           class="tab w-auto"
           aria-label="LIBRARY"
           aria-controls="tab_content"
           hx-get="{% url 'app:home_tab_library' %}"
           hx-target="{{ target }}"
           hx-sync="{{ target }}:replace"
           hx-swap="innerHTML" />
</div>
