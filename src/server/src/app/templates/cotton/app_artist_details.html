<c-vars name="Unknown Artist" bio="" url="" avatar_url="" cover_url="" cover_style="" uploaded_count="0" favourited_count="0" />

<!-- Close button (daisyUI dialog pattern) -->
<form method="dialog">
    <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2 z-30">✕</button>
</form>

<!-- Cover photo + avatar header. Bleed out to the modal-box edges. -->
<div class="-mx-6 -mt-6">
    <div class="relative h-32 w-full rounded-t-[inherit] overflow-hidden bg-base-200"
         {% if cover_url %}
         style="background-image: url('{{ cover_url }}'); background-size: cover; background-position: center;"
         {% else %}
         style="background: {{ cover_style }};"
         {% endif %}>
    </div>
    <div class="px-6 -mt-10 flex items-end gap-3">
        <div class="avatar">
            <div class="w-20 rounded-full bg-base-200 ring ring-base-100 ring-offset-base-100 ring-offset-2">
                <img src="{{ avatar_url }}" alt="{{ name }}" />
            </div>
        </div>
        <div class="min-w-0 pb-1">
            <h3 class="truncate text-lg font-bold leading-tight">{{ name }}</h3>
            {% if url %}
                <a href="{{ url }}" target="_blank" rel="noopener"
                   class="link link-primary block truncate text-xs">{{ url }}</a>
            {% endif %}
        </div>
    </div>
</div>

<!-- Bio -->
<p class="mt-4 text-sm italic opacity-80">{{ bio }}</p>

<!-- Stats -->
<div class="stats stats-horizontal mt-4 w-full bg-base-200">
    <div class="stat place-items-center">
        <div class="stat-title">Sounds</div>
        <div class="stat-value text-2xl">{{ uploaded_count }}</div>
        <div class="stat-desc">uploaded</div>
    </div>
    <div class="stat place-items-center">
        <div class="stat-title">In your collection</div>
        <div class="stat-value text-2xl">{{ favourited_count }}</div>
        <div class="stat-desc">favourited</div>
    </div>
</div>
