<c-vars post="" />
<!--
The mix a post is written about, playable at the head of the post.

It is the shared soundscape card (`c-core-sound-*`, see core_sound_player.html)
composed for reading rather than for building. What that means, control by
control:

  no `+`, no bin — c-explore-article mounts the store with `disable_add`, and
                   `allowAdd` is the switch both of those read. A post has a
                   fixed mix: the writing next to it is about *these* layers.
  no Swap        — the picker is the library's, and reaching it needs the layer
                   options pill, which is not part of this card. Nothing here
                   is a blank layer either, so c-core-sound-empty-layer never
                   draws and `swap_url` has nothing to do.
  everything else — faders, mute, isolate, the carousel, the arrows and the
                   heart all work exactly as they do in the library. A listener
                   is meant to take the post's mix apart while reading it.

Save is live too, and c-core-sound-master carries the post's title into the
save dialog so the copy that lands on a listener's profile is named after the
post they took it from.

The `isEmpty` guards mirror the library card's. A published post always has layers
— the model will not let it publish without a cosound — but c-core-sound-slider
reads `currentLayer.gain` unguarded, so the card must survive a cosound whose
layers were deleted underneath it rather than throw on render.
-->
<c-core-card showExit="false" bgColor="bg-[#1f3f23]" ringColor="ring-[#2d2d2d]">
    <c-core-sound-loading />
    <figure class="relative ring-7 ring-neutral-content/70 rounded-t-md mx-6 mt-7 overflow-visible bg-base-300">
        <div class="static aspect-square w-full rounded-t-md overflow-hidden">
            <c-core-sound-indicator-dock>
                <c-core-sound-card-header>
                    <template x-if="!$store.soundLayers.isEmpty">
                        <c-core-sound-indicator />
                    </template>
                </c-core-sound-card-header>
            </c-core-sound-indicator-dock>
            <c-core-sound-card-figure>
                <template x-if="!$store.soundLayers.isEmpty">
                    <c-core-sound-carousel />
                </template>
            </c-core-sound-card-figure>
        </div>
        <!-- The arrows are positioned against the figure; contents keeps the
             empty-state guard out of that layout relationship. -->
        <template x-if="!$store.soundLayers.isEmpty">
            <div class="contents">
                <c-core-sound-arrows />
            </div>
        </template>
    </figure>
    <template x-if="!$store.soundLayers.isEmpty">
        <c-core-sound-slider />
    </template>
    <div class="relative ring-5 ring-amber-600/60 mx-4 mb-4 rounded-xs rounded-b-2xl bg-white/65 text-black">
        <div class="h-30 overflow-y-auto py-2 px-4">
            <c-core-sound-card-body>
                <c-core-sound-details />
            </c-core-sound-card-body>
        </div>
        <div class="pointer-events-none absolute inset-x-0 bottom-0 h-6 bg-gradient-to-t from-neutral-content/80 to-transparent rounded-b-2xl">
        </div>
    </div>
    <div class="absolute z-10 bottom-0 left-1/2 -translate-x-1/2 ring-6 ring-[#2d2d2d]/60 drop-shadow-2xl flex justify-center rounded-t-2xl bg-base-100 w-fit">
        <!-- The colon form, not an interpolated string attribute. Writing the
             title into the attribute HTML-escapes it, and the transport then
             runs escapejs over *that*, so a title with an apostrophe in it
             reaches the save dialog as `&#x27;`. Passing the value itself
             leaves escapejs as the only escaping it goes through. -->
        <c-core-sound-master :save_title="post.post.title" />
    </div>
</c-core-card>
