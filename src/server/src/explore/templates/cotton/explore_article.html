<c-vars post="" body_html="" sounds="" comments_page="" comment_body="" comment_errors="" comment_count="0"
    has_commented="" pagination_items="" previous_posts="" locked_previous_post="" />
<!-- Full post article, shared by the detail page and the explore slot at the
     top of the list/EXPLORE tab. body_html is the pre-rendered (sanitized)
     markdown from core/renderer.py, and sounds is post.cosound_sounds()
     for the reader — the mix the post is about, mounted above the title.

     The player is here rather than inside the card because the store is global
     (one mix per page) while the card is just one way of showing it; see
     cotton/core_sound_player.html. `disable_add` is what makes this mix fixed:
     a post is written about particular layers, so the card can be taken
     apart but not built on. -->
<article class="w-full max-w-200 text-base-content rounded-3xl overflow-hidden text-left"
    style="--explore-font-family: {{ post.post.font_css_stack }}">
    <div class="px-6 sm:px-12 pb-20">
        <!-- Add `explore-font` to any element that should use the font chosen
             in the admin. Elements without it keep the standard page font. -->
        <c-core-post-heading :post="post.post" />
        <div class="mb-12 mt-8 flex w-full flex-col items-center">
            <c-core-sound-player :sounds="sounds" disable_add="true" />
            <!-- The id is what a layer link in the writing below points at, so
                 it comes from the post rather than being spelled out here:
                 PublicPost.card_anchor_id is the one place both sides read it from. -->
            <c-core-deck :id="post.card_anchor_id">
                <c-explore-cosound-card :post="post" />
            </c-core-deck>
        </div>
        <c-core-post-body :post="post.post" :body_html="body_html" />
        <div class="max-w-160 mx-auto mt-12" x-data="{ tab: 'comments' }">
            <div class="mb-8 flex justify-center">
                <div role="tablist" aria-label="Explore discussion" class="tabs tabs-box">
                    <button type="button" role="tab" class="tab gap-2" :class="{ 'tab-active': tab === 'comments' }"
                        :aria-selected="tab === 'comments'" hx-get="{% url 'explore:discussion' slug=post.slug %}"
                        hx-target="#explore-discussion-{{ post.pk }}" hx-swap="outerHTML" @click="tab = 'comments'">
                        Comments
                        <span id="explore-comment-count-{{ post.pk }}" class="badge badge-sm">{{ comment_count }}</span>
                        <span class="htmx-indicator loading loading-spinner loading-xs"
                            aria-label="Refreshing comments"></span>
                    </button>
                    <button type="button" role="tab" class="tab" :class="{ 'tab-active': tab === 'previous' }"
                        :aria-selected="tab === 'previous'" @click="tab = 'previous'">Previous Posts</button>
                </div>
            </div>
            <div x-show="tab === 'comments'" x-cloak role="tabpanel">
                <c-explore-discussion :post="post" :comments_page="comments_page" :comment_body="comment_body"
                    :comment_errors="comment_errors" :comment_count="comment_count" :has_commented="has_commented"
                    :pagination_items="pagination_items" />
            </div>
            <div x-show="tab === 'previous'" x-cloak role="tabpanel">
                <c-explore-previous-posts :posts="previous_posts" :locked_post="locked_previous_post" />
            </div>
        </div>
    </div>
</article>
