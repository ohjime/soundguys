<c-vars sounds artist_name="" disable_add="" />
<!--
The entry point of the shared soundscape card. Everything named
`c-core-sound-*` is one card anatomy rendered by three surfaces — the library's
LISTEN card, the studio's readout card, and the card over an Explore post — so
a fix to the carousel, the fader or the transport lands in all three at once.
The pieces live in `core` rather than in any one of them because none owns the
card; what each surface owns is how it composes the pieces and what it lets a
listener do with them.

Server -> client handoff. json_script keeps titles and URLs safely escaped.
The Vite soundscape engine owns all audio nodes; Alpine remains the reactive
UI facade and HTMX can replace fragments without managing <audio> elements.

This is also where a page settles two things about the mix it is mounting:

  artist_name — stamped onto blank layers made from the `+` button, so one
                carries the artist the way a dropped track does. The library has
                no artist to name and leaves it empty.
  disable_add — pass it (bare, no value) to mount a mix that cannot grow. The
                `+` on the layer indicator disappears and every path that
                appends refuses, because both read the same store flag.

They belong here rather than on the card or the deck because a page can stack
several cards over one mix — `Alpine.store('soundLayers')` is global — and this
is the single component that brings that mix into being.
-->
{{ sounds|json_script:"soundLayers" }}
<div class="contents" data-cosound-mixer-root x-data x-init="window.CosoundSoundscape.mountStore(document.getElementById('soundLayers'), { artistName: '{{ artist_name|escapejs }}', allowAdd: {% if disable_add %}false{% else %}true{% endif %} })">
</div>
