<c-vars count="" />
<!-- Search over the artist's collected sounds; results replace the list above. -->
<fieldset class="fieldset">
    <legend class="fieldset-legend flex items-center gap-2 fill-neutral text-neutral">
        Your library
        <span id="sound-search-indicator" class="htmx-indicator loading loading-spinner loading-xs"></span>
    </legend>
    <label class="input bg-white outline-neutral">
        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </g>
        </svg>
        <input type="search"
               id="sound-search-input"
               name="q"
               autocomplete="off"
               placeholder="Search {{ count }} sounds"
               hx-get="{% url 'studio:library_search' %}"
               hx-trigger="input changed delay:300ms, search"
               hx-target="#sound-search-results"
               hx-swap="innerHTML"
               hx-indicator="#sound-search-indicator" />
    </label>
    <button type="button" class="btn btn-xs btn-ghost mt-2 self-start"
            hx-get="{% url 'studio:carousel' %}"
            hx-swap="none swap:300ms"
            hx-on:htmx:before-swap="document.querySelectorAll('#card-figure, #card-body').forEach(el => el.classList.add('htmx-swapping'))"
            @click="$store.soundLayers.swappingLayer = false; libraryTarget = null">
        Back to the mix
    </button>
</fieldset>
