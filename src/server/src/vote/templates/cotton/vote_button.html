<c-vars choice="" throttle_seconds_left="0" />
<!-- Keep the original action mounted while login updates the identity block,
     so the shared auth handler can retry this button after sign-in. -->
<div x-data="{
        voted: false,
        secondsLeft: {{ throttle_seconds_left|default:0 }},
        timer: null,
        init() {
            this.timer = setInterval(() => {
                if (this.secondsLeft > 0) this.secondsLeft--;
            }, 1000);
        },
        destroy() { clearInterval(this.timer); }
    }"
    @vote-success.window="voted = true"
    @vote-throttled.window="secondsLeft = Number($event.detail.seconds_left) || 0"
    class="mt-6 flex justify-center">
    <button type="button"
            data-nfc-vote
            class="btn btn-sm rounded-full px-6 {% if choice == '1' %}btn-success{% else %}btn-error{% endif %}"
            hx-post="{% url 'vote:submit_vote' %}?{{ request.GET.urlencode }}"
            hx-swap="none"
            hx-disabled-elt="this"
            :disabled="voted || secondsLeft > 0"
            {% if throttle_seconds_left %}disabled{% endif %}>
        <span x-show="!voted && secondsLeft <= 0" {% if throttle_seconds_left %}style="display: none"{% endif %}>
            {% if choice == '1' %}Upvote{% else %}Downvote{% endif %}
        </span>
        <span x-show="!voted && secondsLeft > 0" {% if not throttle_seconds_left %}style="display: none"{% endif %}>
            Try again in <span x-text="secondsLeft">{{ throttle_seconds_left }}</span>s
        </span>
        <span x-show="voted" style="display: none">Vote sent</span>
    </button>
</div>
