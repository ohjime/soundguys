<div class="join w-fit ring-4" rounded-none>
    <template x-for="(slide, index) in carouselSlides" :key="slide.key">
        <button type="button"
                class="font-mono join-item btn btn-sm h-7 min-h-0 rounded-none border-none bg-neutral px-2.5"
                :class="currentIndex === index ? '!text-white font-extrabold' : 'text-gray-300 font-light'"
                :aria-label="slide.ariaLabel"
                :aria-pressed="currentIndex === index"
                @click="select(index)"
                x-text="slide.indicatorLabel"></button>
    </template>
</div>
