{% partialdef library %}
    <c-core-card showExit="false" bgColor="bg-[#1f3f23]" ringColor="ring-[#2d2d2d]">
        <!-- A blank layer has nothing to audition. Keep the initial loading and
             error states, but playback starts from the first sound selection. -->
        <c-core-sound-loading require_start="false" />
        <c-library-swap-loading />
        <figure class="relative ring-7 ring-neutral-content/70 rounded-t-md mx-6 mt-7 overflow-visible bg-base-300">
            <div class="static aspect-square w-full rounded-t-md overflow-hidden">
                <c-core-sound-indicator-dock>
                    <c-core-sound-card-header>
                        <c-core-sound-indicator />
                    </c-core-sound-card-header>
                </c-core-sound-indicator-dock>
                <c-core-sound-card-figure>
                    <c-core-sound-carousel swap_url="{% url 'library:swap' %}" />
                </c-core-sound-card-figure>
            </div>
            <c-core-sound-arrows />
        </figure>
        <c-core-sound-slider />
        <div class="relative ring-5 ring-amber-600/60 mx-4 mb-4 rounded-xs rounded-b-2xl bg-white/65 text-black">
            <div class="h-30 overflow-y-auto py-2 px-4">
                <c-core-sound-card-body>
                    <div class="italic font-serif font-extralight text-[8pt] font-stretch-95%">
                        <p class="py-1 not-italic font-bold font-serif text-xs font-stretch-95%"
                           x-text="'[ ' + $store.soundLayers.currentLayer.tags + ' ]'"></p>
                        <span x-text="$store.soundLayers.currentLayer.flavor"></span>
                    </div>
                </c-core-sound-card-body>
            </div>
            <div class="pointer-events-none absolute inset-x-0 bottom-0 h-6 bg-gradient-to-t from-neutral-content/80 to-transparent rounded-b-2xl">
            </div>
        </div>
        <div class="absolute z-10 bottom-0 left-1/2 -translate-x-1/2 ring-6 ring-[#2d2d2d]/60 drop-shadow-2xl flex justify-center rounded-t-2xl bg-base-100 w-fit">
            <c-core-sound-master />
        </div>
    </c-core-card>
{% endpartialdef %}
{% partialdef default_view %}
    <c-core-sound-card-figure hx-swap-oob="outerHTML">
        <c-core-sound-carousel swap_url="{% url 'library:swap' %}" />
    </c-core-sound-card-figure>
    <c-core-sound-card-body hx-swap-oob="outerHTML">
        <div class="italic font-serif font-extralight text-[8pt] font-stretch-95%">
            <p class="py-1 not-italic font-bold font-serif text-xs font-stretch-95%"
               x-text="'[ ' + $store.soundLayers.currentLayer.tags + ' ]'"></p>
            <span x-text="$store.soundLayers.currentLayer.flavor"></span>
        </div>
    </c-core-sound-card-body>
{% endpartialdef %}
{% partialdef swap_view %}
    <c-core-sound-card-figure hx-swap-oob="outerHTML">
        <c-library-swap-list :tags="tags" />
    </c-core-sound-card-figure>
    <c-core-sound-card-body hx-swap-oob="outerHTML">
        <c-library-swap-search count="{{ collection_size }}" :tags="tags" />
    </c-core-sound-card-body>
{% endpartialdef %}
{% partialdef swap_tags %}
    <c-library-swap-tags :tags="tags" />
{% endpartialdef %}
{% partialdef swap_results %}
    <c-library-swap-results :sounds="sounds" />
{% endpartialdef %}
