{% extends "core/base.html" %}
{% block title %}
    Library
{% endblock title %}
{% block content %}
    <c-core-loader hx_get="{% url 'library:initial' %}" />
{% endblock content %}
{% partialdef initial %}
    <!-- Library view content fragment, swapped into #tab_content on the home page
         or into the standalone library page shell. -->
    <div id="library_body"
         class="flex w-full flex-col items-center gap-6 px-4 py-6 md:px-8">
        <c-core-tab-body reveal="timer" delay="1400" buttonText="Explore Full Sound Collection ↓">
            <c-slot name="primary">
                <c-library-view :sounds="sounds" section="primary" />
            </c-slot>
            <c-slot name="secondary">
                <c-library-view :sounds="sounds" section="secondary" />
            </c-slot>
        </c-core-tab-body>
    </div>
{% endpartialdef %}
