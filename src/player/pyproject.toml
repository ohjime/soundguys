[project]
name = "player"
description = "None"
readme = "README.md"
version = "0.1.0"

requires-python = ">=3.13"

dependencies = [
    "numpy>=2.4.4",
    "rich>=15.0.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "textual>=1.0.0",
    "typer>=0.25.1",
    "wget>=3.2",
    # Audio conditioning / DSP. Imported lazily and guarded — the player still
    # runs with numpy-only fallbacks if these are not installed, but installing
    # them gives higher-quality resampling and loudness normalisation.
    "soxr>=0.5.0",
    "pyloudnorm>=0.1.1",
    "websockets>=15.0.1,<16",
]
